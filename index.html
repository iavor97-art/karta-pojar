<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта на пожар — чертане</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.min.js"></script>

<style>
  :root{
    --fire:#ff5a1f; --fire-d:#e0400f;
    --glass:rgba(17,21,27,.80);
    --glass-hi:rgba(34,40,49,.92);
    --border:rgba(255,255,255,.10);
    --text:#f2f5f8; --muted:rgba(242,245,248,.58);
    --mono:"SFMono-Regular",ui-monospace,"Roboto Mono",Consolas,monospace;
    --shadow:0 8px 28px rgba(0,0,0,.42);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #map{position:absolute;inset:0;background:#0f141a}

  .glass{
    background:var(--glass);
    -webkit-backdrop-filter:blur(14px) saturate(1.3);
    backdrop-filter:blur(14px) saturate(1.3);
    border:1px solid var(--border);
    box-shadow:var(--shadow);
  }

  /* ── табло с площта ── */
  #areaTag{
    position:absolute;left:14px;bottom:14px;z-index:1000;
    color:var(--text);border-radius:16px;padding:13px 18px 14px;min-width:172px;
    overflow:hidden;
  }
  #areaTag::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--fire)}
  #areaTag .lbl{display:flex;align-items:center;gap:6px;font-size:10px;letter-spacing:1.1px;
    text-transform:uppercase;color:var(--muted);font-weight:700}
  #areaTag .lbl svg{width:12px;height:12px;color:var(--fire)}
  #areaTag .big{font-family:var(--mono);font-size:30px;font-weight:700;color:#ff8a5c;
    line-height:1;margin-top:7px;letter-spacing:-.5px}
  #areaTag .big span{font-size:14px;color:var(--muted);font-weight:600;margin-left:4px;letter-spacing:0}
  #areaTag .sub{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:6px}
  #areaTag.empty::before{background:rgba(255,255,255,.15)}
  #areaTag.empty .lbl svg{color:var(--muted)}
  #areaTag.empty .big{font-size:14px;color:var(--muted);font-family:system-ui;font-weight:600;margin-top:6px}
  #areaTag.empty .sub{display:none}
  #areaTag:not(.empty) .big{animation:pop .35s cubic-bezier(.2,.9,.3,1)}
  @keyframes pop{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* ── кръгли контроли горе вдясно ── */
  .rbtns{position:absolute;top:14px;right:14px;z-index:1000;display:flex;flex-direction:column;gap:9px}
  .rbtns button{
    width:46px;height:46px;border-radius:13px;cursor:pointer;color:var(--text);
    display:grid;place-items:center;transition:transform .12s,border-color .15s,background .15s;
  }
  .rbtns button svg{width:21px;height:21px}
  .rbtns button:hover{background:var(--glass-hi);border-color:rgba(255,255,255,.22);transform:translateY(-1px)}
  .rbtns button:active{transform:translateY(1px)}

  /* ── PDF ── */
  #btnPdf{
    position:absolute;right:14px;bottom:14px;z-index:1000;border:none;border-radius:14px;
    background:linear-gradient(180deg,var(--fire),var(--fire-d));color:#fff;
    font-family:inherit;font-size:14px;font-weight:700;letter-spacing:.3px;padding:13px 20px;cursor:pointer;
    box-shadow:0 8px 22px rgba(255,90,31,.42);display:inline-flex;align-items:center;gap:8px;
    transition:transform .12s,box-shadow .15s,filter .15s;
  }
  #btnPdf svg{width:18px;height:18px}
  #btnPdf:hover{filter:brightness(1.07);box-shadow:0 10px 26px rgba(255,90,31,.55);transform:translateY(-1px)}
  #btnPdf:active{transform:translateY(1px)}
  #btnPdf:disabled{background:var(--glass);color:var(--muted);box-shadow:none;cursor:not-allowed;
    border:1px solid var(--border);filter:none;transform:none}

  /* ── подсказка ── */
  #hint{
    position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:1000;
    color:var(--text);padding:9px 16px;border-radius:22px;font-size:12.5px;font-weight:500;
    display:flex;align-items:center;gap:8px;white-space:nowrap;animation:fadein .5s ease .2s both;
  }
  #hint svg{width:15px;height:15px;color:var(--fire)}
  @keyframes fadein{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}

  /* ── busy ── */
  #busy{position:fixed;inset:0;background:rgba(10,13,17,.62);z-index:3000;display:none;place-items:center;
    -webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
  #busy .box{color:var(--text);padding:22px 30px;border-radius:16px;text-align:center;font-weight:600;border-radius:16px}
  .spin{width:28px;height:28px;border:3px solid rgba(255,255,255,.18);border-top-color:var(--fire);
    border-radius:50%;margin:0 auto 13px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}

  /* ── контроли на Leaflet в тон с темата ── */
  .leaflet-control-zoom{border:none!important;border-radius:13px!important;overflow:hidden;box-shadow:var(--shadow)!important}
  .leaflet-control-zoom a{
    background:var(--glass)!important;color:var(--text)!important;border:none!important;
    border-bottom:1px solid var(--border)!important;
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
    width:38px!important;height:38px!important;line-height:38px!important;font-size:19px!important;
  }
  .leaflet-control-zoom a:last-child{border-bottom:none!important}
  .leaflet-control-zoom a:hover{background:var(--glass-hi)!important}
  .leaflet-control-layers{border:none!important;border-radius:13px!important;box-shadow:var(--shadow)!important;overflow:hidden}
  .leaflet-touch .leaflet-bar,.leaflet-touch .leaflet-control-layers{border:none!important}
</style>
</head>
<body>
  <div id="map"></div>

  <div id="hint" class="glass">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 3 7v6c0 5 3.5 8 9 9 5.5-1 9-4 9-9V7z"/><path d="M9 12l2 2 4-4"/></svg>
    Избери инструмента за площ горе вляво и очертай пожара
  </div>

  <div class="rbtns">
    <button id="btnClear" class="glass" title="Изчисти чертежа" aria-label="Изчисти чертежа">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
    </button>
  </div>

  <div id="areaTag" class="glass empty">
    <div class="lbl">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2s5 4.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 1-3.5S8 11 9 12c0-3 3-6 3-10z"/></svg>
      Площ на пожара
    </div>
    <div class="big">Очертай контура</div>
    <div class="sub"></div>
  </div>

  <button id="btnPdf" disabled>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    Снимка
  </button>

  <div id="busy"><div class="box glass"><div class="spin"></div>Създаване на снимка…</div></div>

<script>
(function(){
  "use strict";

  var map = L.map('map',{zoomControl:true}).setView([42.6977,23.3219],12);

  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,crossOrigin:'anonymous',attribution:'Esri, Maxar'});
  var labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,crossOrigin:'anonymous'});
  var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,crossOrigin:'anonymous',attribution:'© OpenStreetMap'});
  var satGroup = L.layerGroup([sat,labels]).addTo(map);
  L.control.layers({'Сателит':satGroup,'Улична карта':osm},null,{position:'topleft',collapsed:true}).addTo(map);

  // --- Собствено геодезично изчисление на площ (независимо от библиотека) ---
  function geodesicArea(latlngs){
    var R=6378137, area=0, n=latlngs.length, d2r=Math.PI/180;
    if(n<3) return 0;
    for(var i=0;i<n;i++){
      var p1=latlngs[i], p2=latlngs[(i+1)%n];
      area += (p2.lng-p1.lng)*d2r*(2+Math.sin(p1.lat*d2r)+Math.sin(p2.lat*d2r));
    }
    return Math.abs(area*R*R/2);
  }
  function fmt(n,d){d=d==null?0:d;return n.toLocaleString('bg-BG',{minimumFractionDigits:d,maximumFractionDigits:d});}

  // --- Geoman: български надписи + инструменти ---
  map.pm.setLang('bg', {
    tooltips:{
      placeMarker:'Кликни за точка',
      firstVertex:'Кликни за първа точка',
      continueLine:'Кликни за следваща точка',
      finishPoly:'Кликни върху първата точка за затваряне',
      finishLine:'Кликни върху последната точка за край'
    },
    actions:{ finish:'Готово', cancel:'Отказ', removeLastVertex:'Изтрий последната точка' },
    buttonTitles:{
      drawMarkerButton:'Постави точка',
      drawPolyButton:'Очертай площ (полигон)',
      drawLineButton:'Начертай линия',
      editButton:'Редактирай върхове',
      deleteButton:'Изтрий елемент'
    }
  }, 'en');

  map.pm.setGlobalOptions({
    templineStyle:{color:'#e03e1a',weight:3},
    hintlineStyle:{color:'#e03e1a',dashArray:[5,5]},
    pathOptions:{color:'#e03e1a',fillColor:'#e03e1a',fillOpacity:0.25,weight:3}
  });

  map.pm.addControls({
    position:'topleft',
    drawMarker:true, drawPolyline:true, drawPolygon:true,
    drawCircle:false, drawCircleMarker:false, drawRectangle:false, drawText:false,
    editMode:true, dragMode:false, cutPolygon:false, removalMode:true, rotateMode:false
  });

  // --- Управление на начертаните елементи ---
  var items=[];

  function updateArea(){
    var m2=0;
    items.forEach(function(l){
      if(l instanceof L.Polygon){
        var lls=l.getLatLngs();
        if(lls && lls[0] && lls[0].length) m2 += geodesicArea(lls[0]);
      }
    });
    var t=document.getElementById('areaTag'), pdf=document.getElementById('btnPdf');
    if(m2>0){
      t.className='';
      t.querySelector('.big').innerHTML=fmt(m2/1000,1)+' <span>дка</span>';
      t.querySelector('.sub').innerHTML=fmt(m2/10000,2)+' ха · '+fmt(m2,0)+' м²';
      pdf.disabled=false;
      window.__area={m2:m2,dka:m2/1000,ha:m2/10000};
    }else{
      t.className='empty';
      t.querySelector('.big').innerHTML='Очертай контура';
      pdf.disabled=true; window.__area=null;
    }
  }

  map.on('pm:create', function(e){
    items.push(e.layer);
    e.layer.on('pm:edit', updateArea);
    document.getElementById('hint').style.display='none';
    updateArea();
  });
  map.on('pm:remove', function(e){
    items = items.filter(function(l){ return l!==e.layer; });
    updateArea();
  });

  function itemsBounds(){
    var b=L.latLngBounds([]);
    items.forEach(function(l){
      if(l.getBounds) b.extend(l.getBounds());
      else if(l.getLatLng) b.extend(l.getLatLng());
    });
    return b;
  }

  document.getElementById('btnClear').onclick=function(){
    items.forEach(function(l){ map.removeLayer(l); });
    items=[]; updateArea();
  };

  // --- Запазване като снимка (PNG) ---
  // Снимката се сглобява от истинските плочки на картата + чертежа, върху
  // едни и същи координати, затова няма разминаване.
  function drawOverlays(ctx, s){
    items.forEach(function(l){
      if(l instanceof L.Polygon){
        var ring=l.getLatLngs()[0];
        if(!ring||!ring.length) return;
        ctx.beginPath();
        ring.forEach(function(ll,i){ var pt=map.latLngToContainerPoint(ll);
          if(i) ctx.lineTo(pt.x*s,pt.y*s); else ctx.moveTo(pt.x*s,pt.y*s); });
        ctx.closePath();
        ctx.fillStyle='rgba(224,62,26,0.25)'; ctx.fill();
        ctx.lineWidth=3*s; ctx.strokeStyle='#e03e1a'; ctx.lineJoin='round'; ctx.stroke();
      } else if(l instanceof L.Polyline){
        var pts=l.getLatLngs();
        if(!pts||!pts.length) return;
        ctx.beginPath();
        pts.forEach(function(ll,i){ var pt=map.latLngToContainerPoint(ll);
          if(i) ctx.lineTo(pt.x*s,pt.y*s); else ctx.moveTo(pt.x*s,pt.y*s); });
        ctx.lineWidth=4*s; ctx.strokeStyle='#f0a202'; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
      } else if(l.getLatLng){
        var pt=map.latLngToContainerPoint(l.getLatLng()), x=pt.x*s, y=pt.y*s, r=6*s;
        ctx.beginPath(); ctx.arc(x,y,r,0,2*Math.PI);
        ctx.fillStyle='#e03e1a'; ctx.fill();
        ctx.lineWidth=2*s; ctx.strokeStyle='#fff'; ctx.stroke();
      }
    });
  }

  // изчаква всички видими плочки да се заредят напълно
  function waitForTiles(done){
    var start=Date.now();
    (function check(){
      var imgs=map.getContainer().querySelectorAll('img.leaflet-tile'), pending=0;
      imgs.forEach(function(im){ if(!(im.complete && im.naturalWidth>0)) pending++; });
      if(pending===0 || Date.now()-start>4000) done();
      else setTimeout(check,150);
    })();
  }

  // сглобява плочки + чертеж в един canvas
  function composeCanvas(){
    var mapEl=map.getContainer(), rect=mapEl.getBoundingClientRect();
    var dpr=Math.min(window.devicePixelRatio||1, 2);
    var cw=Math.round(rect.width*dpr), ch=Math.round(rect.height*dpr);
    var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
    var ctx=cv.getContext('2d');
    ctx.fillStyle='#0f141a'; ctx.fillRect(0,0,cw,ch);
    var tiles=mapEl.querySelectorAll('img.leaflet-tile');
    tiles.forEach(function(im){
      if(!(im.complete && im.naturalWidth>0)) return;
      im.style.opacity=1;                                  // Leaflet избледнява при зареждане
      var r=im.getBoundingClientRect();
      var x=(r.left-rect.left)*dpr, y=(r.top-rect.top)*dpr, w=r.width*dpr, h=r.height*dpr;
      try{ ctx.drawImage(im, x, y, w, h); }catch(e){}
    });
    drawOverlays(ctx, dpr);
    return cv;
  }

  document.getElementById('btnPdf').onclick=function(){
    if(!window.__area)return;
    var busy=document.getElementById('busy'); busy.style.display='grid';
    try{ var b=itemsBounds(); if(b.isValid()) map.fitBounds(b.pad(0.2),{animate:false}); }catch(e){}
    waitForTiles(function(){
      setTimeout(function(){
        var url;
        try{ url=composeCanvas().toDataURL('image/png'); }
        catch(e){
          busy.style.display='none'; console.error(e);
          alert('Не можах да запазя снимката. Опитай пак или намали малко увеличението.');
          return;
        }
        var a=document.createElement('a');
        a.href=url; a.download='pozhar_'+new Date().toISOString().slice(0,10)+'.png';
        document.body.appendChild(a); a.click(); a.remove();
        busy.style.display='none';
      }, 250);
    });
  };

  setTimeout(function(){map.invalidateSize();},200);
})();
</script>
</body>
</html>
