<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Карта на пожар — чертане</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.20.0/dist/leaflet-geoman.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>

<style>
  :root{ --fire:#e03e1a; --fire-d:#b32c0e; --ink:#14181d;
         --mono:"SFMono-Regular",ui-monospace,Consolas,monospace; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #map{position:absolute;inset:0;background:#c9d2da}

  #areaTag{
    position:absolute;left:12px;bottom:12px;z-index:1000;
    background:rgba(20,24,29,.9);color:#fff;border-radius:12px;padding:12px 16px;
    box-shadow:0 4px 16px rgba(0,0,0,.3);min-width:150px;backdrop-filter:blur(4px);transition:opacity .2s;
  }
  #areaTag .lbl{font-size:10px;letter-spacing:.9px;text-transform:uppercase;opacity:.65;font-weight:700}
  #areaTag .big{font-family:var(--mono);font-size:26px;font-weight:700;color:#ff7a52;line-height:1.1;margin-top:3px}
  #areaTag .big span{font-size:13px;opacity:.85;margin-left:3px}
  #areaTag .sub{font-family:var(--mono);font-size:11px;opacity:.7;margin-top:4px}
  #areaTag.empty .big{font-size:14px;color:#9fb0c0;font-family:system-ui;font-weight:600}
  #areaTag.empty .sub{display:none}

  .rbtns{position:absolute;top:12px;right:12px;z-index:1000;display:flex;flex-direction:column;gap:8px}
  .rbtns button{
    width:44px;height:44px;border:none;border-radius:10px;background:#fff;font-size:18px;cursor:pointer;
    box-shadow:0 2px 10px rgba(0,0,0,.25);display:grid;place-items:center;
  }
  .rbtns button:active{transform:translateY(1px)}

  #btnPdf{
    position:absolute;right:12px;bottom:12px;z-index:1000;
    border:none;border-radius:12px;background:var(--fire);color:#fff;
    font-family:inherit;font-size:14px;font-weight:700;padding:13px 18px;cursor:pointer;
    box-shadow:0 4px 16px rgba(224,62,26,.4);display:inline-flex;align-items:center;gap:7px;
  }
  #btnPdf:hover{background:var(--fire-d)}
  #btnPdf:disabled{background:#9aa3ac;box-shadow:none;cursor:not-allowed}
  #btnPdf:active{transform:translateY(1px)}

  /* подсказка при първо зареждане */
  #hint{
    position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:1000;
    background:rgba(20,24,29,.9);color:#fff;padding:8px 14px;border-radius:20px;font-size:12.5px;
    box-shadow:0 2px 10px rgba(0,0,0,.25);white-space:nowrap;
  }

  #busy{position:fixed;inset:0;background:rgba(20,24,29,.55);z-index:3000;display:none;place-items:center}
  #busy .box{background:var(--ink);color:#fff;padding:20px 26px;border-radius:12px;text-align:center;font-weight:600}
  .spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.25);border-top-color:var(--fire);
        border-radius:50%;margin:0 auto 12px;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div id="map"></div>

  <div id="hint">Избери ⬠ горе вляво и очертай площта на пожара</div>

  <div class="rbtns">
    <button id="btnGps" title="Моето местоположение">📍</button>
    <button id="btnClear" title="Изчисти чертежа">🗑</button>
  </div>

  <div id="areaTag" class="empty">
    <div class="lbl">Площ на пожара</div>
    <div class="big">Очертай контура</div>
    <div class="sub"></div>
  </div>

  <button id="btnPdf" disabled>⤓ PDF</button>

  <div id="busy"><div class="box"><div class="spin"></div>Генериране на PDF…</div></div>

<script>
(function(){
  "use strict";

  var map = L.map('map',{zoomControl:true}).setView([42.6977,23.3219],12);

  var sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,crossOrigin:'anonymous',attribution:'Esri, Maxar'});
  var labels = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
    {maxZoom:19,crossOrigin:'anonymous'});
  var osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {maxZoom:19,crossOrigin:'anonymous',attribution:'© OpenStreetMap'});
  var satGroup = L.layerGroup([sat,labels]).addTo(map);
  L.control.layers({'Сателит':satGroup,'Улична карта':osm},null,{position:'topleft',collapsed:true}).addTo(map);

  // --- Собствено геодезично изчисление на площ (независимо от библиотека) ---
  function geodesicArea(latlngs){
    var R=6378137, area=0, n=latlngs.length, d2r=Math.PI/180;
    if(n<3) return 0;
    for(var i=0;i<n;i++){
      var p1=latlngs[i], p2=latlngs[(i+1)%n];
      area += (p2.lng-p1.lng)*d2r*(2+Math.sin(p1.lat*d2r)+Math.sin(p2.lat*d2r));
    }
    return Math.abs(area*R*R/2);
  }
  function fmt(n,d){d=d==null?0:d;return n.toLocaleString('bg-BG',{minimumFractionDigits:d,maximumFractionDigits:d});}

  // --- Geoman: български надписи + инструменти ---
  map.pm.setLang('bg', {
    tooltips:{
      placeMarker:'Кликни за точка',
      firstVertex:'Кликни за първа точка',
      continueLine:'Кликни за следваща точка',
      finishPoly:'Кликни върху първата точка за затваряне',
      finishLine:'Кликни върху последната точка за край'
    },
    actions:{ finish:'Готово', cancel:'Отказ', removeLastVertex:'Изтрий последната точка' },
    buttonTitles:{
      drawMarkerButton:'Постави точка',
      drawPolyButton:'Очертай площ (полигон)',
      drawLineButton:'Начертай линия',
      editButton:'Редактирай върхове',
      deleteButton:'Изтрий елемент'
    }
  }, 'en');

  map.pm.setGlobalOptions({
    templineStyle:{color:'#e03e1a',weight:3},
    hintlineStyle:{color:'#e03e1a',dashArray:[5,5]},
    pathOptions:{color:'#e03e1a',fillColor:'#e03e1a',fillOpacity:0.25,weight:3}
  });

  map.pm.addControls({
    position:'topleft',
    drawMarker:true, drawPolyline:true, drawPolygon:true,
    drawCircle:false, drawCircleMarker:false, drawRectangle:false, drawText:false,
    editMode:true, dragMode:false, cutPolygon:false, removalMode:true, rotateMode:false
  });

  // --- Управление на начертаните елементи ---
  var items=[];

  function updateArea(){
    var m2=0;
    items.forEach(function(l){
      if(l instanceof L.Polygon){
        var lls=l.getLatLngs();
        if(lls && lls[0] && lls[0].length) m2 += geodesicArea(lls[0]);
      }
    });
    var t=document.getElementById('areaTag'), pdf=document.getElementById('btnPdf');
    if(m2>0){
      t.className='';
      t.querySelector('.big').innerHTML=fmt(m2/1000,1)+' <span>дка</span>';
      t.querySelector('.sub').innerHTML=fmt(m2/10000,2)+' ха · '+fmt(m2,0)+' м²';
      pdf.disabled=false;
      window.__area={m2:m2,dka:m2/1000,ha:m2/10000};
    }else{
      t.className='empty';
      t.querySelector('.big').innerHTML='Очертай контура';
      pdf.disabled=true; window.__area=null;
    }
  }

  map.on('pm:create', function(e){
    items.push(e.layer);
    e.layer.on('pm:edit', updateArea);
    document.getElementById('hint').style.display='none';
    updateArea();
  });
  map.on('pm:remove', function(e){
    items = items.filter(function(l){ return l!==e.layer; });
    updateArea();
  });

  function itemsBounds(){
    var b=L.latLngBounds([]);
    items.forEach(function(l){
      if(l.getBounds) b.extend(l.getBounds());
      else if(l.getLatLng) b.extend(l.getLatLng());
    });
    return b;
  }

  document.getElementById('btnClear').onclick=function(){
    items.forEach(function(l){ map.removeLayer(l); });
    items=[]; updateArea();
  };

  // --- GPS ---
  var meMarker=null;
  document.getElementById('btnGps').onclick=function(){
    if(!navigator.geolocation){alert('Няма поддръжка за геолокация.');return;}
    var b=this;b.textContent='…';
    navigator.geolocation.getCurrentPosition(function(p){
      var ll=[p.coords.latitude,p.coords.longitude];map.setView(ll,16);
      if(meMarker)map.removeLayer(meMarker);
      meMarker=L.circleMarker(ll,{radius:8,color:'#1f6fe0',fillColor:'#3b82f6',fillOpacity:.9,weight:2}).addTo(map);
      b.textContent='📍';
    },function(){alert('Не успях да взема местоположение (провери GPS разрешенията).');b.textContent='📍';},
    {enableHighAccuracy:true,timeout:10000});
  };

  // --- PDF ---
  // Рисува начертаните елементи директно върху заснетия canvas (html2canvas
  // не хваща надеждно векторния слой на Leaflet)
  function drawOverlays(ctx, s){
    items.forEach(function(l){
      if(l instanceof L.Polygon){
        var ring=l.getLatLngs()[0];
        if(!ring||!ring.length) return;
        ctx.beginPath();
        ring.forEach(function(ll,i){ var pt=map.latLngToContainerPoint(ll);
          if(i) ctx.lineTo(pt.x*s,pt.y*s); else ctx.moveTo(pt.x*s,pt.y*s); });
        ctx.closePath();
        ctx.fillStyle='rgba(224,62,26,0.25)'; ctx.fill();
        ctx.lineWidth=3*s; ctx.strokeStyle='#e03e1a'; ctx.lineJoin='round'; ctx.stroke();
      } else if(l instanceof L.Polyline){
        var pts=l.getLatLngs();
        if(!pts||!pts.length) return;
        ctx.beginPath();
        pts.forEach(function(ll,i){ var pt=map.latLngToContainerPoint(ll);
          if(i) ctx.lineTo(pt.x*s,pt.y*s); else ctx.moveTo(pt.x*s,pt.y*s); });
        ctx.lineWidth=4*s; ctx.strokeStyle='#f0a202'; ctx.lineJoin='round'; ctx.lineCap='round'; ctx.stroke();
      } else if(l.getLatLng){
        var pt=map.latLngToContainerPoint(l.getLatLng()), x=pt.x*s, y=pt.y*s, r=6*s;
        ctx.beginPath(); ctx.arc(x,y,r,0,2*Math.PI);
        ctx.fillStyle='#e03e1a'; ctx.fill();
        ctx.lineWidth=2*s; ctx.strokeStyle='#fff'; ctx.stroke();
      }
    });
  }

  document.getElementById('btnPdf').onclick=function(){
    if(!window.__area)return;
    var busy=document.getElementById('busy');busy.style.display='grid';
    var mapEl=document.getElementById('map');
    var hide=document.querySelectorAll('.leaflet-control-container,.rbtns,#btnPdf,#areaTag,#hint');
    hide.forEach(function(el){el.style.visibility='hidden';});

    // побери чертежа в кадъра (без анимация, за да съвпаднат координатите)
    try{ var b=itemsBounds(); if(b.isValid()) map.fitBounds(b.pad(0.2),{animate:false}); }catch(e){}

    setTimeout(function(){
      // скрий векторния и маркерния слой, за да не се дублират с ръчното чертане
      var op=map.getPane('overlayPane'), mp=map.getPane('markerPane');
      op.style.visibility='hidden'; mp.style.visibility='hidden';

      html2canvas(mapEl,{useCORS:true,allowTaint:false,logging:false,scale:2})
      .then(function(cv){
        op.style.visibility=''; mp.style.visibility='';
        hide.forEach(function(el){el.style.visibility='';});
        var ctx=cv.getContext('2d'), s=cv.width/mapEl.clientWidth;
        drawOverlays(ctx,s);                                   // чертежът върху снимката
        makePdf(cv.toDataURL('image/jpeg',0.92),cv.width,cv.height);
      })
      .catch(function(err){
        op.style.visibility=''; mp.style.visibility='';
        hide.forEach(function(el){el.style.visibility='';});
        busy.style.display='none'; console.error(err);
        alert('Картата не се засне автоматично. Алтернатива: Печат на браузъра → Запази като PDF.');
      });
    },1100);
  };

  function makePdf(img,cw,ch){
    var jsPDF=window.jspdf.jsPDF;
    var landscape = cw >= ch;                       // PDF-ът следва формата на снимката
    var doc=new jsPDF({orientation:landscape?'landscape':'portrait',unit:'mm',format:'a4'});
    var W=doc.internal.pageSize.getWidth(), H=doc.internal.pageSize.getHeight(), mgn=12;
    var d=new Date(),p=function(x){return String(x).padStart(2,'0');};
    var when=p(d.getDate())+'.'+p(d.getMonth()+1)+'.'+d.getFullYear()+' g., '+p(d.getHours())+':'+p(d.getMinutes());
    var c=itemsBounds().getCenter();

    // заглавна лента
    doc.setFillColor(20,24,29);doc.rect(0,0,W,18,'F');
    doc.setFillColor(224,62,26);doc.rect(0,0,6,18,'F');
    doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(13);
    doc.text('KARTA NA POZHAR — ochertana plosht',mgn,11.5);
    doc.setFont('helvetica','normal');doc.setFontSize(9);
    doc.text(when+' ch.',W-mgn,11.5,{align:'right'});

    // карта — вписана пропорционално (contain), центрирана, БЕЗ разтягане
    var top=24, footerH=22;
    var availW=W-2*mgn, availH=H-top-footerH-6;
    var ar=cw/ch, dw=availW, dh=dw/ar;
    if(dh>availH){ dh=availH; dw=dh*ar; }
    var dx=mgn+(availW-dw)/2, dy=top+(availH-dh)/2;
    try{doc.addImage(img,'JPEG',dx,dy,dw,dh,'','FAST');}catch(e){}
    doc.setDrawColor(200);doc.rect(dx,dy,dw,dh);

    // лента с площ + координати
    var by=top+availH+2;
    doc.setFillColor(251,243,238);doc.setDrawColor(242,217,205);
    doc.roundedRect(mgn,by,Math.min(118,availW),20,2,2,'FD');
    doc.setTextColor(179,44,14);doc.setFont('helvetica','bold');doc.setFontSize(15);
    doc.text('Plosht: '+fmt(window.__area.dka,1)+' dka',mgn+5,by+9);
    doc.setTextColor(58,64,72);doc.setFont('helvetica','normal');doc.setFontSize(9);
    doc.text(fmt(window.__area.ha,2)+' ha  ·  '+fmt(window.__area.m2,0)+' m2',mgn+5,by+16);
    doc.setTextColor(58,64,72);doc.setFontSize(8.5);
    doc.text('Centar: '+c.lat.toFixed(5)+', '+c.lng.toFixed(5), W-mgn, by+8, {align:'right'});
    doc.setTextColor(150,156,164);doc.setFontSize(7);
    doc.text('Geodezichno izchislenie · Esri World Imagery / OpenStreetMap', W-mgn, by+15, {align:'right'});

    doc.save('pozhar_'+new Date().toISOString().slice(0,10)+'.pdf');
    document.getElementById('busy').style.display='none';
  }

  setTimeout(function(){map.invalidateSize();},200);
})();
</script>
</body>
</html>
